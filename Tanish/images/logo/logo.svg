<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 76" width="340" height="76" fill="none">
  <!-- Minimalist Emblem -->
  <g transform="translate(6, 8)">
    <rect x="2" y="2" width="56" height="56" rx="2" fill="#152238" stroke="#B38F4D" stroke-width="1.2"/>
    <!-- Dome of Victoria Memorial & Howrah Bridge Minimal Lines -->
    <path d="M12 44 L48 44" stroke="#EEE7D7" stroke-width="1.2" stroke-linecap="round"/>
    <path d="M14 44 L22 28 L30 44 L38 28 L46 44" stroke="#B38F4D" stroke-width="1.2" stroke-linejoin="round"/>
    <path d="M22 28 L38 28" stroke="#B38F4D" stroke-width="1.2"/>
    <!-- Dome silhouette -->
    <path d="M26 28 Q30 19 34 28 Z" fill="#EEE7D7"/>
    <line x1="30" y1="19" x2="30" y2="15" stroke="#B38F4D" stroke-width="1.2"/>
    <circle cx="30" cy="14" r="1.2" fill="#B38F4D"/>
  </g>
  
  <!-- Typography -->
  <text x="76" y="34" font-family="'Playfair Display', 'Cormorant Garamond', Georgia, serif" font-size="24" font-weight="700" fill="#152238" letter-spacing="4">KOLKATA</text>
  <text x="77" y="49" font-family="'Plus Jakarta Sans', system-ui, sans-serif" font-size="9" font-weight="600" fill="#9C3D28" letter-spacing="2">HERITAGE ARCHIVE &amp; PORTAL</text>
  <text x="77" y="62" font-family="'Playfair Display', Georgia, serif" font-size="8.5" font-style="italic" fill="#5E6875" letter-spacing="1">The City of Joy</text>
</svg>
