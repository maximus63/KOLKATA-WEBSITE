      <stop offset="0%" stop-color="#1B3B6F"/>
      <stop offset="100%" stop-color="#0C1B33"/>
    </linearGradient>
    <pattern id="grid_Victoria_Memorial" width="60" height="60" patternUnits="userSpaceOnUse">
